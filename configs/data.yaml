# Data build (docs/DATA.md section 2). All randomness derives from seed: every split
# uses random.Random(f"{seed}:{split}"), and the held-out intents use "{seed}:held_out".
version: v1.3                    # v1.3: one gold-dependent question per record, form nouls, JSON states (decision 42)
                                 # v1.2: noul and score diversity (decision 41); v1.1: negated noul questions (decision 40)
seed: 0
out_dir: data
base_config: configs/base.yaml   # tokenizer_reference for the encoding check
max_tokens: 1024                 # every record must encode within the training max_tokens

clinc:
  k_min: 3                       # options per choice question, including "other"
  k_max: 14
  p_gold_in_options: 0.8
  held_out_per_domain: 2
  # The one gold-dependent noul per record. out_of_scope is fixed by the option 1 rule
  # (as many in-scope records as out-of-scope utterances); every other record draws
  # about_domain or about_intent in the ratio of these weights.
  kind_weights: {about_domain: 0.45, about_intent: 0.45, out_of_scope: 0.10}
  p_asked_from_options: 0.8      # a "no" noul asks a distractor option (or its domain) with this probability

sst5:
  p_three_levels: 0.3            # share of SST-5 records, per split, that use the 3-level scale

unseen:
  n_per_set: 1000
  banking77_options: 10          # gold, 8 distractors and "other"
  yelp_per_star: 200             # test_yelp: stratified, 200 reviews per star
  yelp_max_chars: 2500           # only reviews this short are sampled, so every record fits max_tokens

# Noul balance (decisions 32, 40, 41): every noul question is negated in exactly half of each
# (kind, underlying answer) group, with templates and polarity from shuffled balanced blocks.
max_phrasing_only_accuracy: 0.55 # build fails if answering each phrasing with its majority answer beats this

noul_balance: [0.4, 0.6]         # build fails if a noul kind's yes share is outside this range

# Form nouls (data v1.3): 0, 1 or 2 per record, answered from the state text alone.
form:
  max_imbalance: 0.02            # a kind is used for a (split, source) only if its best threshold splits those texts within 48-52 percent
  p_before_first: 0.3333         # each form noul goes before the first gold-dependent question with this probability
  # Splits with form nouls: the training sources only (decision 44). The evaluation-only splits
  # (test_agnews, test_emotion, test_banking77, test_yelp) have none.
  splits: [train, valid, test_indomain, test_unseen_intents, test_sst5]

state_format:
  p_json: 0.2                    # share of records per split whose state is a JSON object with 1 to 3 extra fields

# CPU gates run by make data after the build (decision 42, docs/DATA.md section 8).
leak_probe:
  folds: 5                       # cross-validation folds of each logistic regression probe
  hard_lift: 0.10                # fail if a probe beats its group's majority baseline by more than this, unconditionally
  max_lift: 0.03                 # fail if a probe beats it by more than this ...
  null_percentile: 0.99          # ... and by more than this percentile of the lifts on shuffled targets
  permutations: 200              # shuffled-target runs per probe above max_lift
  min_n: 50                      # groups with fewer questions are not probed
