[project]
name = "jevmark"
version = "0.1.0"
description = "A small System One decision model: typed questions in, probability distributions out, one forward pass, no text generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.56",  # from_pretrained(dtype=...) needs 4.56
    "peft>=0.11",
    "datasets>=2.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# fastapi and uvicorn are in dev too so the endpoint is tested; httpx backs fastapi.testclient.
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
baselines = ["openai>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevmark"]

# Local development is CPU only. macOS wheels on PyPI are already CPU builds;
# on Linux, pull torch from the CPU index so a local sync never fetches CUDA.
# Kaggle keeps its preinstalled torch but installs transformers, peft and
# datasets at the exact versions in uv.lock (decision 23).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette wants httpx2 for its TestClient; we keep httpx (decision 29), so hide only that one warning.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
